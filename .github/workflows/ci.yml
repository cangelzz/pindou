name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  test-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install VS Code extension dependencies
        run: cd platforms/vscode && npm ci
      - name: Build VS Code extension
        run: cd platforms/vscode && npm run build
      - name: Run VS Code adapter unit tests
        run: cd platforms/vscode && npm run test:unit
      - name: Install Playwright browsers
        run: cd platforms/vscode && npx playwright install --with-deps chromium
      - name: Run VS Code webview tests
        run: cd platforms/vscode && npm run test:webview
      - name: Run VS Code host smoke tests (real VS Code via test-electron)
        run: cd platforms/vscode && xvfb-run -a npm run test:e2e
        env:
          DISPLAY: ":99.0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vscode-test-results
          path: platforms/vscode/test-results/

  test-extension:
    # Store screenshot pixels are compared with the Ubuntu 24.04 baseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Chrome extension
        run: npm run ext:build:chrome
      - name: Build Edge extension
        run: npm run ext:build:edge
      - name: Validate extension builds
        run: npm run ext:validate
      - name: Run extension packaging tests
        run: npm run ext:test:packaging
      - name: Run extension contract tests
        run: npm run ext:test:contract
      - name: Run extension end-to-end tests
        run: xvfb-run -a npm run ext:test:e2e
      - name: Test and validate committed store screenshots
        run: npm run test:screenshots
      - name: Check committed store screenshots are current
        run: npm run ext:screenshots:check
      - name: Package Chrome and Edge extensions
        run: npm run ext:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-extension-artifacts
          if-no-files-found: warn
          path: |
            artifacts/*.zip
            test-results/
            playwright-report/

  build:
    needs: [test, test-vscode, test-extension]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
