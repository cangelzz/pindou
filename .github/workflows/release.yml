name: Release

on:
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump major version? (yes/no)"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute version
        id: ver
        run: |
          VERSION=$(bash scripts/version.sh)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

  create-draft-release:
    needs: compute-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          if IS_DRAFT=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Release ${TAG} already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
            echo "Draft release ${TAG} already exists"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "PindouVerse ${TAG}" \
              --notes "PindouVerse ${VERSION}"
          fi

  build-browser-extensions:
    needs: [compute-version, create-draft-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Chrome extension
        run: npm run ext:build:chrome
      - name: Build Edge extension
        run: npm run ext:build:edge
      - name: Validate extension builds
        run: npm run ext:validate
      - name: Package Chrome and Edge extensions
        run: npm run ext:package
      - name: Assert versioned extension artifacts
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          test "$(node scripts/version.mjs)" = "${VERSION}"
          test -f "artifacts/pindouverse-chrome-${VERSION}.zip"
          test -f "artifacts/pindouverse-edge-${VERSION}.zip"
      - name: Upload extension assets to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          gh release upload "${TAG}" \
            "artifacts/pindouverse-chrome-${VERSION}.zip" \
            "artifacts/pindouverse-edge-${VERSION}.zip" \
            --clobber

  build-and-upload:
    needs: [compute-version, create-draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Apply version
        run: bash scripts/version.sh --apply
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.compute-version.outputs.tag }}
          releaseName: PindouVerse ${{ needs.compute-version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  finalize-release:
    needs: [compute-version, create-draft-release, build-and-upload, build-browser-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Auto-generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.compute-version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" \
              --jq '.body')
          else
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" --jq '.body')
          fi
          gh release edit "$TAG" --notes "$NOTES"
