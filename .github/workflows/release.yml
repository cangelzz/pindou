# Emergency-only workflow for approved Legacy Desktop compatibility or security releases.
name: Legacy Desktop Release

on:
  workflow_dispatch:
    inputs:
      confirm_emergency_release:
        description: "Type RELEASE_LEGACY_DESKTOP to confirm the emergency release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
    steps:
      - name: Confirm emergency-only release
        env:
          CONFIRMATION: ${{ inputs.confirm_emergency_release }}
        run: |
          if [ "${CONFIRMATION}" != "RELEASE_LEGACY_DESKTOP" ]; then
            echo "Legacy Desktop releases require the exact emergency confirmation" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute version
        id: ver
        run: |
          VERSION=$(bash scripts/version.sh)
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} from ${SOURCE_SHA}"

  create-draft-release:
    needs: compute-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.tag }}
          VERSION: ${{ needs.compute-version.outputs.version }}
          SOURCE_SHA: ${{ needs.compute-version.outputs.source_sha }}
        run: |
          if RELEASE=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft,targetCommitish 2>/dev/null); then
            IS_DRAFT=$(jq -r '.isDraft' <<<"${RELEASE}")
            TARGET_COMMITISH=$(jq -r '.targetCommitish' <<<"${RELEASE}")
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Release ${TAG} already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
            if [ "${TARGET_COMMITISH}" != "${SOURCE_SHA}" ]; then
              echo "Draft release ${TAG} targets ${TARGET_COMMITISH}, expected ${SOURCE_SHA}" >&2
              exit 1
            fi
            echo "Draft release ${TAG} already exists for ${SOURCE_SHA}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --draft \
              --title "PindouVerse ${TAG}" \
              --notes "PindouVerse ${VERSION}"
          fi

  build-and-upload:
    name: Build and upload Legacy Desktop
    needs: [compute-version, create-draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.compute-version.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Apply version
        run: bash scripts/version.sh --apply
      - name: Verify source commit before upload
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.compute-version.outputs.source_sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "Checked out ${ACTUAL_SHA}, expected ${SOURCE_SHA}" >&2
            exit 1
          fi
      - name: Build Legacy Desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.compute-version.outputs.tag }}
          releaseName: PindouVerse ${{ needs.compute-version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  finalize-release:
    name: Prepare Legacy Desktop draft release notes
    needs: [compute-version, create-draft-release, build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.compute-version.outputs.source_sha }}
          fetch-depth: 0
      - name: Update draft release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.compute-version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" -f previous_tag_name="$PREV_TAG" \
              --jq '.body')
          else
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$TAG" --jq '.body')
          fi
          gh release edit "$TAG" --notes "$NOTES"
